name: Weekly Contributor Snapshot Sync

on:
  schedule:
    # Runs every Monday at 02:00 UTC (matching committers.top weekly snapshot release)
    - cron: '0 2 * * 1'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  weekly-sync:
    name: Sync Regional Rankings & Contributor Stats
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Run Weekly Sync Script
        working-directory: frontend
        env:
          NODE_ENV: production
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          GITHUB_TOKEN: ${{ secrets.COMMITY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: node scripts/sync-weekly.js
